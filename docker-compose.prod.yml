services:
  db:
    image: mongo:latest
    container_name: hub-project-db
    # Identifiants lus depuis un fichier .env (racine du repo, gitignore) — jamais
    # codes en dur dans ce fichier versionne. NB : ces valeurs ne s'appliquent qu'a
    # la PREMIERE initialisation du volume ; sur un volume existant, changer le mot
    # de passe se fait via db.changeUserPassword (cf. guide-remediation-vps.md).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: hub_project_db
    # Pas de mapping de port : la base n'est joignable que par les autres conteneurs
    # via le reseau interne app-network (db:27017). Pour un acces admin distant,
    # passer par un tunnel SSH, jamais par un port publie.
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: always

  # Service pour le serveur backend
  server:
    build:
      context: server/
      dockerfile: Dockerfile.prod
    container_name: hub-project-server
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - server/.env.prod
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network
    restart: always

  # Service pour le client frontend
  client:
    build:
      context: client
      dockerfile: Dockerfile.prod
    container_name: hub-project-client
    depends_on:
      - server
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: always

# Volumes pour persister les données
volumes:
  mongodb_data:
  uploads_data:

# Réseau commun pour tous les services
networks:
  app-network:
    driver: bridge
